dataset_path: parquet
dataset_kwargs:
  data_files: lmms_eval/tasks/rs_bench/data/rs_urban_expansion_cd.parquet
task: "rs_urban_expansion_cd"
test_split: train
output_type: generate_until
doc_to_visual: !function utils.rs_doc_to_visual_change
doc_to_text: !function utils.rs_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  do_sample: false
process_results: !function utils.rs_process_results
metric_list:
  - metric: accuracy
    aggregation: !function utils.rs_aggregate_results
    higher_is_better: true
metadata:
  version: 1.0
  category: "Change Detection"
  num_samples: 19
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."
